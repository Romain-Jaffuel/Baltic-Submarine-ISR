[project]
name = "baltic-isr"
version = "0.0.0"
description = "Speed-versus-endurance trade-off for an AUV fleet holding contact on suspicious vessels in the Gulf of Finland"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pyproj>=3.7",
    # The world, the fleet and the belief grid are tensors on the GPU. See
    # docs/spec.md section 6.4 -- there is no Python loop over vehicles.
    "torch>=2.8",
]

[project.scripts]
baltic-isr = "baltic_isr.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.115",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]
render = [
    "matplotlib>=3.9",
    "imageio[ffmpeg]>=2.36",
]
# Only scripts/ingest_geodata.py needs these, it runs once and offline, and what
# it writes is versioned. Nothing at runtime and nothing in CI imports them.
geodata = [
    "scipy>=1.14",
    "pillow>=11.0",
]

# The torch wheel PyPI serves for Windows is CPU-only: every CUDA runtime it
# depends on is pinned to sys_platform == 'linux'. This project is meant to run
# on a local RTX 2060, so Windows pulls torch from PyTorch's own CUDA index.
# cu128 rather than cu130 is deliberate -- Turing (sm_75) is beyond doubt there.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baltic_isr"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "D"]
ignore = ["D100", "D104", "D105", "D107", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "SLF001"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/baltic_isr"]
