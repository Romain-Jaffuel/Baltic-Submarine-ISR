name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Verify the lockfile is up to date
        run: uv lock --check

      - name: Install the project
        # The render group too: the chart and the films are tested like
        # everything else. Not `geodata` -- scipy and pillow belong to
        # scripts/ingest_geodata.py, which runs once, offline, by hand, and
        # whose output is versioned.
        run: uv sync --locked --group render

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

      - name: Smoke test the CLI on a bare checkout
        run: uv run baltic-isr budget
